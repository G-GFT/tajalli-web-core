<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم للمجتمع - Tajalli Plus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-main: #d4af37;
            --bg-dark: #0a0e17;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            background: radial-gradient(circle at center, #142033 0%, var(--bg-dark) 100%);
            color: #fff; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        .icon { font-size: 3rem; margin-bottom: 10px; }
        h1 { color: var(--gold-main); margin-bottom: 10px; font-size: 1.5rem; }
        p { color: #ccc; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; }
        .form-group { text-align: right; margin-bottom: 15px; }
        label { display: block; color: var(--gold-main); font-size: 0.9rem; margin-bottom: 5px; font-weight: bold;}
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--gold-main); }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(45deg, #b38615, var(--gold-main));
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        #error-msg { color: #ff6b6b; margin-top: 15px; display: none; font-weight: bold;}
        .success-msg { color: #4ade80; margin-top: 15px; display: none; font-weight: bold; line-height: 1.5;}
    </style>
</head>
<body>

    <div class="login-box" id="login-screen">
        <div class="icon">🚢</div>
        <h1>مجتمع سفينة نوح</h1>
        <p>أهلاً بك. يرجى إكمال بياناتك للانضمام إلى المنصة. <br>سيتم إرسال كود التفعيل إلى بريدك الإلكتروني.</p>
        
        <form id="joinForm">
            <div class="form-group">
                <label for="fullName">الاسم الكامل</label>
                <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
            </div>
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label for="activationCode">كود الدفع / التفعيل</label>
                <input type="text" id="activationCode" placeholder="أدخل كود الدفع (إن وجد)" required>
            </div>
            
            <button type="submit" id="submitBtn">تفعيل الدخول وإرسال البيانات</button>
        </form>
        
        <div id="error-msg">عذراً، حدث خطأ. يرجى التأكد من البيانات والمحاولة مرة أخرى.</div>
        <div id="success-msg" class="success-msg">تم التحقق من بياناتك بنجاح! <br> تم إرسال كود التفعيل الخاص بك إلى بريدك الإلكتروني، وسيتم تحويلك إلى البوت...</div>
    </div>

    <script>
        // رابط الويب هوك الخاص بك من Make.com (الذي يعمل كالساعة)
        const MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/9nzqswvpyktdd410abin1qcvq6gd6f39";

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const activationCode = document.getElementById('activationCode').value.trim();
            
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const submitBtn = document.getElementById('submitBtn');
            
            // إخفاء الرسائل السابقة وتغيير حالة الزر
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.innerText = "جاري التحقق...";
            submitBtn.disabled = true;

            try {
                // إرسال البيانات إلى Make.com
                const response = await fetch(MAKE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: "register_and_verify",
                        fullName: fullName,
                        email: email,
                        activationCode: activationCode,
                        timestamp: new Date().toISOString()
                    })
                });

                // Make سيرسل رداً (Response) بعد التحقق
                const data = await response.json();

                if (response.ok && data.status === "success") {
                    successMsg.style.display = 'block';
                    
                    // حفظ البيانات في المتصفح
                    localStorage.setItem('community_access', 'true');
                    
                    // توجيه المستخدم إلى رابط التليجرام الذي سيرسله Make
                    setTimeout(() => {
                        window.location.href = data.telegramUrl || "https://t.me/YourTelegramChannel"; 
                    }, 3000);
                } else {
                    throw new Error("Verification failed");
                }

            } catch (error) {
                console.error("Error:", error);
                errorMsg.style.display = 'block';
                submitBtn.innerText = "تفعيل الدخول وإرسال البيانات";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
