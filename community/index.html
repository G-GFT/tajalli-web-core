<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم للمجتمع - Tajalli Plus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-main: #d4af37;
            --bg-dark: #0a0e17;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            background: radial-gradient(circle at center, #142033 0%, var(--bg-dark) 100%);
            color: #fff; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        .icon { font-size: 3rem; margin-bottom: 15px; }
        h1 { color: var(--gold-main); margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #ccc; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.6; }
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111827;
            color: white;
            text-align: center;
            font-size: 1.1rem;
        }
        input:focus { outline: none; border-color: var(--gold-main); }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #b38615, var(--gold-main));
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        #error-msg { color: #ff6b6b; margin-top: 15px; display: none; }
        .success-msg { color: #4ade80; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-box" id="login-screen">
        <div class="icon">🚢</div>
        <h1>مجتمع سفينة نوح</h1>
        <p>أهلاً بك. يرجى إدخال كود الدخول (Activation Code) الخاص بك للانضمام إلى المنصة.</p>
        
        <form id="joinForm">
            <input type="text" id="accessCode" placeholder="أدخل كود الدخول هنا" required>
            <button type="submit" id="submitBtn">تفعيل الدخول</button>
        </form>
        
        <div id="error-msg">عذراً، الكود غير صحيح أو منتهي الصلاحية.</div>
        <div id="success-msg" class="success-msg">تم التحقق بنجاح! جاري تحويلك إلى البوت...</div>
    </div>

    <script>
        // رابط الويب هوك الخاص بك من Make.com
        const MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/q945esvv0dkd82bgmeb0u5v6pf6clx5b";

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = document.getElementById('accessCode').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const submitBtn = document.getElementById('submitBtn');
            
            // إخفاء الرسائل السابقة وتغيير حالة الزر
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.innerText = "جاري التحقق...";
            submitBtn.disabled = true;

            try {
                // إرسال الكود إلى Make.com
                const response = await fetch(MAKE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: "verify_code",
                        accessCode: code,
                        timestamp: new Date().toISOString()
                    })
                });

                // Make سيرسل رداً (Response) بعد التحقق من Google Sheets
                const data = await response.json();

                // افترض أن Make سيرسل { "status": "success", "telegramUrl": "..." }
                if (response.ok && data.status === "success") {
                    successMsg.style.display = 'block';
                    
                    // حفظ الكود في المتصفح
                    localStorage.setItem('community_access', code);
                    
                    // توجيه المستخدم إلى رابط التليجرام الذي سيرسله Make
                    setTimeout(() => {
                        window.location.href = data.telegramUrl || "https://t.me/YourTelegramChannel"; 
                    }, 1500);
                } else {
                    throw new Error("Code not found or invalid");
                }

            } catch (error) {
                console.error("Error:", error);
                errorMsg.style.display = 'block';
                submitBtn.innerText = "تفعيل الدخول";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
