<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-GFT Dashboard - Protected Area</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: #0a0e17;
            color: white;
            display: flex; align-items: center; justify-content: center;
            height: 100vh;
            background-image: radial-gradient(circle at center, #142033 0%, #05070c 100%);
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        h1 { color: #d4af37; margin-bottom: 10px; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111827;
            color: white;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.1rem;
        }
        input:focus { outline: none; border-color: #d4af37; }
        button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        button:hover { background: #b38615; }
        #error-msg { color: #ff6b6b; margin-top: 10px; display: none; }
        #dashboard-content { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; overflow: auto; background: white; }
        
        /* تنسيق الكود الخاص بك داخل الصفحة */
        #dashboard-content iframe {
            width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="login-box" id="login-screen">
        <h1>🔒 منطقة محمية</h1>
        <p>هذه الصفحة مخصصة للإدارة فقط. يرجى إدخال كلمة المرور للمتابعة.</p>
        <input type="password" id="password" placeholder="أدخل كلمة المرور">
        <button onclick="checkPassword()">دخول</button>
        <div id="error-msg">كلمة المرور غير صحيحة!</div>
    </div>

    <!-- لوحة التحكم (يتم تحميلها بعد كلمة المرور) -->
    <div id="dashboard-content">
        <!-- يمكنك وضع كود الـ HTML الخاص بك هنا مباشرة، أو استدعاء ملف خارجي -->
        <!-- هنا سنستخدم iframe لتحميل صفحة لوحة التحكم الأصلية التي أرسلتها -->
        <iframe id="dashboard-iframe" src="dashboard-src.html" style="display:none;"></iframe>
        <div id="iframe-loading" style="text-align:center; padding-top:50px; color:#333;">جاري تحميل لوحة التحكم...</div>
    </div>

    <script>
        // كلمة المرور (يمكنك تغييرها هنا)
        const secretPassword = "145836729dede"; 

        function checkPassword() {
            const input = document.getElementById('password').value;
            const error = document.getElementById('error-msg');
            
            if (input === secretPassword) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';
                
                // تحميل لوحة التحكم داخل الـ iframe
                const iframe = document.getElementById('dashboard-iframe');
                iframe.style.display = 'block';
                document.getElementById('iframe-loading').style.display = 'none';

                // إزالة زر الأمان حتى لا تظهر الصفحة للعامة
                localStorage.setItem('g7gft_authorized', 'true');
            } else {
                error.style.display = 'block';
                // اهتزاز بسيط للصندوق
                const box = document.querySelector('.login-box');
                box.style.transform = 'translateX(-10px)';
                setTimeout(() => box.style.transform = 'translateX(10px)', 100);
                setTimeout(() => box.style.transform = 'translateX(0)', 200);
            }
        }

        // السماح بالدخول إذا تم تسجيل الدخول مسبقاً في نفس الجلسة
        window.onload = function() {
            if (localStorage.getItem('g7gft_authorized') === 'true') {
                // يمكنك تفعيل هذا السطر إذا أردت أن يبقى مفتوحاً
                // document.getElementById('login-screen').style.display = 'none';
                // document.getElementById('dashboard-content').style.display = 'block';
            }
        };
    </script>
</body>
</html>
